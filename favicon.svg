<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Santé sexuelle positive">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdebd9"/>
      <stop offset=".55" stop-color="#f7d6d1"/>
      <stop offset="1" stop-color="#d9cbe6"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1b9b1"/>
      <stop offset="1" stop-color="#d65a6a"/>
    </linearGradient>
  </defs>
  <!-- rounded square plate -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="#3a2a4a" stroke-width="2.5"/>
  <!-- mint blob accent -->
  <circle cx="50" cy="14" r="6" fill="#c8e3dc" stroke="#3a2a4a" stroke-width="1.5"/>
  <!-- left arm hugging -->
  <path d="M10 30 Q 12 18 24 20 Q 30 22 28 30"
        fill="none" stroke="#3a2a4a" stroke-width="3" stroke-linecap="round"/>
  <path d="M10 30 Q 12 18 24 20 Q 30 22 28 30"
        fill="none" stroke="#e8a87a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- right arm hugging -->
  <path d="M54 30 Q 52 18 40 20 Q 34 22 36 30"
        fill="none" stroke="#3a2a4a" stroke-width="3" stroke-linecap="round"/>
  <path d="M54 30 Q 52 18 40 20 Q 34 22 36 30"
        fill="none" stroke="#c0a9d8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- heart -->
  <path d="M32 50
           C 18 41, 14 30, 22 26
           C 27 23, 31 27, 32 30
           C 33 27, 37 23, 42 26
           C 50 30, 46 41, 32 50 Z"
        fill="url(#heart)" stroke="#3a2a4a" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- sparkle -->
  <path d="M14 46 l1.2 2.8 2.8 1.2 -2.8 1.2 -1.2 2.8 -1.2 -2.8 -2.8 -1.2 2.8 -1.2 Z"
        fill="#3a2a4a"/>
</svg>
